# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pycodestyle pyflakes exceptiongroup iniconfig packaging
        pip install PyQt6 PyQt6-Qt6
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install system dependencies (for Ubuntu)
      if: runner.os == 'Linux'
      run: |
        while sudo fuser /var/lib/dpkg/lock-frontend 2>/dev/null; do sleep 1; done
        sudo apt-get update
        sudo apt-get install -y libegl1 libxcb-xinerama0
        sudo apt-get install -y libxcb-xinerama0 libxcb-xfixes0 libx11-xcb1 libxrandr2
        sudo apt-get install -y '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev
        ps aux | grep Xvfb
        pip install pytest-qt
        sudo apt-get install -y qtbase5-dev qtchooser qt6-base-dev
        sudo apt-get install -y qt6-qpa-plugins qt6-wayland

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Debug directory structure
      run: |
        echo "Current directory:"
        pwd
        echo "Contents of the current directory:"
        ls -la
        echo "Contents of the ./tests directory (if it exists):"
        ls -la ./tests || echo "No tests directory found"

        
    - name: Run tests
      run: |
        if [ -d "./tests" ]; then
          pytest ./tests --maxfail=1 --disable-warnings -v
        else
          echo "No tests directory found, skipping pytest."
        fi
