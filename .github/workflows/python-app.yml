# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8==5.0.4 pytest==7.2.0 pycodestyle==2.12.1 pyflakes==3.2.0 exceptiongroup==1.2.2 iniconfig==2.0.0 packaging==24.2
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi


        
    - name: Install system dependencies (for Ubuntu)
      if: runner.os == 'Linux'
      run: |
        while sudo fuser /var/lib/dpkg/lock-frontend 2>/dev/null; do sleep 1; done  # wait for lock to release
        sudo apt-get update
        sudo apt-get install -y libegl1 libxcb-xinerama0
        sudo apt-get install -y libxcb-xinerama0 libxcb-xfixes0 libx11-xcb1 libxrandr2
        sudo apt-get install -y '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev
        ps aux | grep Xvfb
        pip install pytest-qt
        sudo apt-get install -y qtbase5-dev qtchooser qt6-base-dev
        
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run tests
      run: |
        pytest --maxfail=1 --disable-warnings -v 

